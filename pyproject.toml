[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolsmith"
version = "0.2.0"
description = "Audit and compile Python tool schemas for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Shayan Mousavinia" }
]
keywords = [
  "mcp",
  "llm",
  "agents",
  "tool-calling",
  "json-schema",
  "pydantic"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "jsonschema>=4.22",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "editables>=0.5",
  "mypy>=1.10,<1.19",
  "pytest>=8.0",
  "ruff>=0.5",
  "twine>=5.0"
]

[project.urls]
Repository = "https://github.com/ShAmoNiA/mcp-toolsmith"
Issues = "https://github.com/ShAmoNiA/mcp-toolsmith/issues"

[project.scripts]
mcp-toolsmith = "mcp_toolsmith.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_toolsmith"]

[tool.hatch.build]
exclude = [
  "/.git",
  "/.venv",
  "/build",
  "/dist",
  "/dist_*",
  "/__pycache__",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.mypy_cache"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
